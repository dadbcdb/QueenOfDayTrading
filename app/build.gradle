plugins { id 'com.android.application' }
android {
    namespace 'kr.stockdiary'
    compileSdk 35
    defaultConfig { applicationId 'kr.stockdiary'; minSdk 26; targetSdk 35; versionCode 4; versionName '0.1.3' }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    testOptions { unitTests.returnDefaultValues = true; unitTests.includeAndroidResources = true }
}
dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    testImplementation 'com.squareup.okhttp3:mockwebserver:3.14.9'
    testImplementation 'org.robolectric:robolectric:4.14.1'
}
